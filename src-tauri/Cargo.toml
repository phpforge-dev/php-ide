[package]
name = "php-ide"
version = "0.2.20"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
phpforge-database = { git = "https://github.com/phpforge-dev/plugin-database", rev = "2857d6889d1077bd0802a066e7271c47c662be36" }
phpforge-agents = { git = "https://github.com/phpforge-dev/plugin-agents", rev = "aa585d9dac2116b6024a503361daf1cae14d3458" }
phpforge-git = { git = "https://github.com/phpforge-dev/plugin-git", rev = "9056c30de8098380a9605ac0fcf0c6f238438f6f" }
phpforge-terminal = { git = "https://github.com/phpforge-dev/plugin-terminal", rev = "5eba8143d583efe66dd0a02cffce710413817c68" }
phpforge-docker-services = { git = "https://github.com/phpforge-dev/plugin-docker-services", rev = "ae7bf9c2757087cde0e826cb674e9d224d03e11b" }
phpforge-php-intelligence = { git = "https://github.com/phpforge-dev/plugin-php-intelligence", rev = "f3bee71e12f5b9a147c6c8e1a236ab8014310741" }
dunce = "1"
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
rfd = "0.15"
walkdir = "2"
notify = "8"
chrono = "0.4"
flate2 = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSImage", "NSImageView", "NSColor", "NSTextField", "NSControl", "NSFont", "NSText", "objc2-quartz-core", "objc2-core-graphics"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
