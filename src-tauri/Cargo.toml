[package]
name = "php-ide"
version = "0.2.16"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
phpforge-database = { git = "https://github.com/phpforge-dev/plugin-database", rev = "b5e78bfb10144868be039e2b114ff514bc5d7b5b" }
phpforge-agents = { git = "https://github.com/phpforge-dev/plugin-agents", rev = "1ccbf7c7018b236a47cb79a7c2f4fe6ef9e15826" }
phpforge-git = { git = "https://github.com/phpforge-dev/plugin-git", rev = "7e55bfbc0ec9079a18a8ef89f3d8764ba0d36035" }
phpforge-terminal = { git = "https://github.com/phpforge-dev/plugin-terminal", rev = "5eba8143d583efe66dd0a02cffce710413817c68" }
phpforge-docker-services = { git = "https://github.com/phpforge-dev/plugin-docker-services", rev = "bc95a57fb5049c6f84876a0e4c3ced9459205b91" }
phpforge-php-intelligence = { git = "https://github.com/phpforge-dev/plugin-php-intelligence", rev = "eb922ddd4299b2ab52fe9877de9c93b7c3502c86" }
dunce = "1"
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
rfd = "0.15"
walkdir = "2"
notify = "8"
chrono = "0.4"
flate2 = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSImage", "NSImageView", "NSColor", "NSTextField", "NSControl", "NSFont", "NSText", "objc2-quartz-core", "objc2-core-graphics"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
