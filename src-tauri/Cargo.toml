[package]
name = "php-ide"
version = "0.2.10"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
dunce = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
portable-pty = "0.9"
rfd = "0.15"
walkdir = "2"
notify = "8"
futures-util = "0.3"
chrono = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite", "json", "chrono", "uuid"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
flate2 = "1"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
oracle-rs = "0.1.7"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSImage", "NSImageView", "NSColor", "NSTextField", "NSControl", "NSFont", "NSText", "objc2-quartz-core", "objc2-core-graphics"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
