name: Signed IDE updates

# Full signed release for an existing tag: macOS DMG, Windows NSIS and Linux deb/AppImage, plus
# updater signatures and latest.json. It fails unless the Tauri updater key is configured;
# Apple and Windows code signing still apply only when their own secrets exist.
# Use this instead of "Desktop installers" once the updater key exists (both attach the same files).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching the app version
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-builds.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      publish: true
      macos: true
      updater: required
    secrets: inherit
